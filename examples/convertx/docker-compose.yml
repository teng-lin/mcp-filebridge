# ConvertX MCP stack: the MCP server + converter, backed by the shared object store.
#
#   cp .env.example .env   # set MCP_BEARER_TOKEN + CONVERTX_JWT_SECRET
#   docker compose up -d --build
#   make smoke             # round-trip a file end to end
#
# The MCP server binds host loopback only. A consolidated host-networked tunnel can
# publish it, or the optional standalone connector can be enabled:
#   docker compose --profile cloudflare up -d --build
# See README.md ("Connect from claude.ai").
services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${CONVERTX_JWT_SECRET:?set CONVERTX_JWT_SECRET in .env}
      ACCOUNT_REGISTRATION: "true"       # lets the MCP server self-create its account on first run
    volumes: ["convertx-data:/app/data"]
    # No published port: only the MCP server talks to it (internal network).

  convertx-mcp:
    build:
      context: ../..                     # repo root, so the image can COPY python/ + this example
      dockerfile: examples/convertx/Dockerfile
    image: convertx-filebridge:local
    restart: unless-stopped
    environment:
      # Private shared-store endpoint for server writes; public endpoint for presigned URLs.
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to the shared store's private endpoint}
      CONVERTX_URL: http://convertx:3000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT to the shared store's public origin}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set the convertx S3 access key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set the convertx S3 secret key}
      S3_BUCKET: ${S3_BUCKET:-convertx}
      CONVERTX_EMAIL: ${CONVERTX_EMAIL:-mcp@convertx.local}
      CONVERTX_PASSWORD: ${CONVERTX_PASSWORD:?set CONVERTX_PASSWORD in .env}
      # This server's own PUBLIC url (for /u/<shortid> widget links). Prod = tunnel URL.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9400}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      # Self-hosted OAuth for the claude.ai web connector (bearer keeps working for
      # Claude Code). Set both in .env; unset both to stay bearer-only.
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_BASE_URL: ${MCP_OAUTH_BASE_URL:-}
      # Static client ID (best practice) → disables open DCR; enter these in Claude's
      # connector "Advanced settings". Unset both to fall back to open DCR.
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ALLOW_DCR: ${MCP_OAUTH_ALLOW_DCR:-}   # keep RFC 7591 as a fallback for ChatGPT
      MCP_OAUTH_STATE_PATH: /data/oauth_state.json   # survives redeploys (volume below)
      MCP_OAUTH_TRUST_PROXY: "1"                      # behind Cloudflare: trust CF-Connecting-IP for the login throttle
      MCP_HOST: "0.0.0.0"
      MCP_ALLOW_EXTERNAL_BIND: "1"       # 0.0.0.0 bind is intentional; bearer/OAuth still enforced
    ports: ["127.0.0.1:${MCP_HOST_PORT:-9400}:9400"]
    volumes: ["oauth-state:/data"]       # OAuth client registry + tokens (a full-account secret)
    depends_on:
      convertx: { condition: service_started }
    networks:
      default:
      object-storage:

  # --- Optional: expose the MCP server to claude.ai over HTTPS (needs a CF tunnel) --
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}  # route the tunnel hostname -> http://convertx-mcp:9400
    depends_on:
      convertx-mcp: { condition: service_healthy }

volumes:
  convertx-data:
  oauth-state:

networks:
  object-storage:
    external: true
    name: object-storage
