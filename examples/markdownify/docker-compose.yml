# Self-contained markdownify stack — independent of the ConvertX stack.
# Own MinIO + OAuth gateway (TS backend) + dedicated Cloudflare tunnel, all on this
# project's own network (markdownify_default). Nothing shared with ConvertX.
#   cp .env.example .env   # set MCP_BEARER_TOKEN + OAuth + APPS_CF_TUNNEL_TOKEN
#   docker compose up -d --build
# Dashboard routes for the dedicated tunnel:
#   s3-markdownify.hantekllc.com -> http://minio:9000
#   markdownify.hantekllc.com    -> http://gateway:8090
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spikekey}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-spikesecret}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"   # MinIO sets CORS here (no PutBucketCors API)
    ports: ["${MINIO_HOST_PORT:-9101}:9000"]   # host publish (dev/debug; the tunnel uses docker-DNS)
    volumes: ["mdfy-minio:/data"]

  gateway:
    build:
      context: ../..               # repo root (COPY ts/ + examples/convertx/oauth.py)
      dockerfile: examples/markdownify/Dockerfile
    image: markdownify-filebridge:local
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://minio:9000                                   # internal (own MinIO)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://s3-markdownify.hantekllc.com}  # presign host
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-spikekey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-spikesecret}
      S3_BUCKET: ${S3_BUCKET:-markdownify}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://markdownify.hantekllc.com}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_BASE_URL: ${MCP_OAUTH_BASE_URL:-https://markdownify.hantekllc.com}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ALLOW_DCR: ${MCP_OAUTH_ALLOW_DCR:-}
      MCP_OAUTH_TRUST_PROXY: "1"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8090"
    ports: ["${MCP_HOST_PORT:-8090}:8090"]     # host publish (dev/debug; the tunnel uses docker-DNS)
    volumes: ["mdfy-oauth:/data"]  # OAuth state (a full-account secret)
    depends_on:
      minio: { condition: service_started }

  # Dedicated Cloudflare tunnel connector. On this stack's own network, so it resolves
  # minio + gateway by docker-DNS. http2 because QUIC/UDP 7844 egress is blocked here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${APPS_CF_TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  mdfy-minio:
  mdfy-oauth:
