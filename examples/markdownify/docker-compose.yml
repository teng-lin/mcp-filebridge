# Markdownify gateway backed by the shared object store.
#   cp .env.example .env   # set MCP_BEARER_TOKEN, OAuth, and S3 credentials
#   docker compose up -d --build
# The gateway binds host loopback for the consolidated application tunnel.
services:
  gateway:
    build:
      context: ../..               # repo root (COPY ts/ + examples/convertx/oauth.py)
      dockerfile: examples/markdownify/Dockerfile
    image: markdownify-filebridge:local
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to the shared store's private endpoint}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT to the shared store's public origin}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set the markdownify S3 access key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set the markdownify S3 secret key}
      S3_BUCKET: ${S3_BUCKET:-markdownify}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://markdownify.hantekllc.com}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_BASE_URL: ${MCP_OAUTH_BASE_URL:-https://markdownify.hantekllc.com}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ALLOW_DCR: ${MCP_OAUTH_ALLOW_DCR:-}
      MCP_OAUTH_TRUST_PROXY: "1"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8090"
    ports: ["127.0.0.1:${MCP_HOST_PORT:-8090}:8090"]
    volumes: ["mdfy-oauth:/data"]  # OAuth state (a full-account secret)
    networks:
      default:
      object-storage:

  # Optional standalone tunnel. The consolidated host deployment does not enable it.
  cloudflared:
    profiles: ["standalone-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  mdfy-oauth:

networks:
  object-storage:
    external: true
    name: object-storage
