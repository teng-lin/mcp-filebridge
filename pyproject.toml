[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-filebridge"
version = "0.1.0"
description = "Cross-language S3 file side-channel for remote MCP servers, plus a reusable self-hosted OAuth provider, MCP-Apps upload widget, and convert-on-upload broker route."
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "requests>=2.31", "starlette>=0.37", "fastmcp>=3.4,<4", "anyio>=4"]

[project.optional-dependencies]
markitdown = ["markitdown[pdf,docx,pptx,xlsx]", "uvicorn"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["mcp_filebridge"]
